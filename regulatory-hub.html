<title>华为软件技术 · 法规标准信息平台</title>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#CF0A2C;--primary-light:#FDE8EC;--accent:#1E1E30;--bg:#F4F5F9;--card:#FFF;--folder:#F0F1F6;--text:#2D2D3A;--text-sec:#6E6E7E;--text-muted:#9A9AA8;--border:#E2E3EA;--radius:10px;--shadow:0 1px 4px rgba(0,0,0,0.05);--event-pri:#E8F5E9;--event-warn:#FFF8E1;--event-pun:#FFEBEE;--event-case:#E3F2FD;--event-info:#F3E5F5}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{background:linear-gradient(135deg,#1E1E30 0%,#2B2B48 100%);color:#fff;padding:28px 16px 22px;text-align:center;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 80%,rgba(207,10,44,0.10) 0%,transparent 60%)}
.header-content{position:relative;z-index:1;max-width:700px;margin:0 auto}
.header-badge{display:inline-block;background:var(--primary);color:#fff;padding:3px 12px;border-radius:16px;font-size:10px;font-weight:500;letter-spacing:.5px;margin-bottom:8px}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header p{font-size:11px;color:rgba(255,255,255,0.6);max-width:520px;margin:4px auto 0}
.container{max-width:860px;margin:0 auto;padding:16px 10px 32px}
.view-toggle{display:flex;gap:4px;margin-bottom:10px;background:var(--card);border-radius:10px;padding:3px;box-shadow:var(--shadow);width:fit-content;flex-wrap:wrap}
.view-btn{padding:4px 14px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;transition:all .2s;color:var(--text-sec);font-family:inherit}
.view-btn.active{background:var(--primary);color:#fff}
.biz-bar{display:none;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.biz-bar.show{display:flex}
.biz-chip{background:var(--card);border-radius:8px;padding:5px 8px;font-size:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:5px;cursor:pointer;border:2px solid transparent;transition:all .12s;user-select:none;flex:1 0 calc(33% - 4px);min-width:100px}
.biz-chip:hover{border-color:var(--border)}
.biz-chip.active{border-color:var(--primary);background:var(--primary-light)}
.biz-chip .emoji{font-size:16px}
.biz-chip .info{flex:1;min-width:0}
.biz-chip .info .name{font-size:11px;font-weight:600}
.biz-chip .info .cnt{font-size:8px;color:var(--text-muted)}
.biz-chip .check{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px;color:transparent;transition:all .12s}
.biz-chip.active .check{background:var(--primary);border-color:var(--primary);color:#fff}
.biz-hint{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--primary-light);border-radius:6px;margin-bottom:10px;font-size:11px;border:1px solid rgba(207,10,44,0.15)}
.biz-hint .close{margin-left:auto;cursor:pointer;font-size:12px;color:var(--text-muted);background:none;border:none;padding:0 3px}
.toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.search-box{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:11px;font-family:inherit;outline:none;transition:border-color .2s}
.search-box:focus{border-color:var(--primary)}
.filter-tabs{display:flex;gap:3px;flex-wrap:wrap}
.filter-tab{padding:3px 8px;border-radius:12px;font-size:9px;cursor:pointer;border:1px solid var(--border);background:var(--card);transition:all .12s;color:var(--text-sec);user-select:none}
.filter-tab:hover{border-color:var(--primary);color:var(--primary)}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.stats-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.stat-pill{background:var(--card);border-radius:14px;padding:2px 8px;font-size:9px;color:var(--text-sec);box-shadow:var(--shadow)}
.stat-pill strong{color:var(--primary)}
.folder-list{display:flex;flex-direction:column;gap:3px}
.folder{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid transparent;transition:border-color .15s}
.folder.hidden{display:none}
.folder-header{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;transition:background .12s;user-select:none}
.folder-header:hover{background:#FAFBFF}
.folder-header .arrow{font-size:9px;color:var(--text-muted);transition:transform .2s;flex-shrink:0;width:12px;text-align:center}
.folder.open .folder-header .arrow{transform:rotate(90deg)}
.folder-header .ficon{font-size:14px;text-align:center;flex-shrink:0;width:20px}
.folder-header .meta{flex:1;min-width:0}
.folder-header .meta .name{font-size:12px;font-weight:600}
.folder-header .meta .desc{font-size:9px;color:var(--text-sec);margin-top:1px}
.folder-header .badge{background:var(--primary-light);color:var(--primary);font-size:9px;font-weight:600;padding:1px 7px;border-radius:8px;flex-shrink:0}
.folder-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.folder.open .folder-body{max-height:9999px}
.law-list{padding:0 12px 6px;display:flex;flex-direction:column;gap:2px}
.law-row{display:flex;align-items:flex-start;gap:5px;padding:5px 7px;border-radius:5px;border-left:3px solid var(--primary);background:var(--folder);transition:background .12s}
.law-row:hover{background:#E8EAEF}
.law-row .year{font-size:9px;font-weight:600;color:var(--text-muted);flex-shrink:0;width:28px;padding-top:1px}
.law-row .info{flex:1;min-width:0}
.law-row .info .title{font-size:10px;font-weight:500;line-height:1.4}
.law-row .info .src{font-size:8px;color:var(--text-sec);margin-top:1px}
.law-row .info .src span{display:inline-block;background:rgba(207,10,44,0.06);padding:0 4px;border-radius:2px;font-size:7px;color:var(--primary);margin-right:2px}
.law-row .info .biz-tags{margin-top:1px;display:flex;gap:2px;flex-wrap:wrap}
.law-row .info .biz-tag{font-size:7px;padding:0 4px;border-radius:5px;background:#E3F0FF;color:#1A5D8F;line-height:1.6}
.law-row .links{display:flex;gap:2px;flex-shrink:0;flex-wrap:wrap;align-items:center;margin-top:1px}
.law-row .links a{font-size:7px;text-decoration:none;padding:1px 5px;border-radius:7px;border:1px solid var(--border);color:var(--text-sec);transition:all .1s;white-space:nowrap}
.law-row .links a:hover{border-color:var(--primary);color:var(--primary);background:rgba(207,10,44,0.04)}
.event-row{border-left-color:#1565C0;background:#F5F8FF}
.event-row:hover{background:#E3EDFF}
.event-row .tp{font-size:7px;padding:1px 5px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:1px;margin-right:4px;font-weight:600;display:inline-block}
.tp-pun{background:#FFEBEE;color:#C62828}
.tp-warn{background:#FFF8E1;color:#F57F17}
.tp-case{background:#E3F2FD;color:#1565C0}
.tp-info{background:#F3E5F5;color:#7B1FA2}
.tp-new{background:#E8F5E9;color:#2E7D32}
.event-row .desc{font-size:9px;color:var(--text-sec);margin-top:1px;line-height:1.5}
.event-row .risk-tag{display:inline-block;font-size:7px;padding:0 4px;border-radius:4px;background:rgba(21,101,192,0.08);color:#1565C0;margin-right:2px}
.empty{text-align:center;padding:24px 16px;color:var(--text-muted);font-size:11px}
.footer{background:var(--accent);color:rgba(255,255,255,0.4);padding:16px 12px;text-align:center;font-size:9px;line-height:1.8}
.footer strong{color:#fff}
@media(max-width:600px){.header h1{font-size:17px}.container{padding:10px 6px 24px}.folder-header{padding:6px 8px}.law-row{padding:4px 6px}}
</style>
</head>

]};const BM={};for(const b of DATA.BIZ)BM[b.k]=b;const AB=DATA.BIZ.map(b=>b.k);const RD={};for(const a of DATA.AREAS){RD[a.id]={ic:a.icon,nm:a.name};for(const l of a.laws)l._rid=a.id;for(const l of a.laws)l._rin=a.icon+a.name}
let CS='all',SB=null,OF=null,CV='risk';
const TP={pun:'⚖️ 行政处罚',warn:'⚠️ 监管通报',case:'⚖️ 典型案例',info:'📋 监管数据',new:'🆕 新规'};
const TPCL={pun:'tp-pun',warn:'tp-warn',case:'tp-case',info:'tp-info',new:'tp-new'};

function render(){const s=document.getElementById('searchInput').value.trim().toLowerCase();const mc=document.getElementById('mainContent');const bb=document.getElementById('bizBar');const bh=document.getElementById('bizHint');
if(CV==='event'){bb.classList.remove('show');bh.style.display='none';renderEvents(mc,s);return}
if(CV==='biz'){bb.classList.remove('show');bh.style.display='none';renderBiz(mc,s);document.getElementById('statsBar').innerHTML='<span class="stat-pill">🏢 点击业务查看其适用法规</span>';return}
bb.classList.add('show');
if(SB){bh.style.display='flex';document.getElementById('bizHintText').textContent='🔍 筛选：'+BM[SB].n+' 相关法规 '+BM[SB].e;document.querySelectorAll('.biz-chip').forEach(c=>c.classList.toggle('active',c.dataset.biz===SB))}else{bh.style.display='none';document.querySelectorAll('.biz-chip').forEach(c=>c.classList.remove('active'))}
updateBC();let total=0,html='';
for(const a of DATA.AREAS){let laws=a.laws.filter(l=>{if(CS!=='all'&&!l.s.includes(CS))return false;if(s&&!l.t.toLowerCase().includes(s))return false;if(SB&&(!l.b||!l.b.includes(SB)))return false;return true});if(!laws.length)continue;laws.sort((x,y)=>(x.y==='—'?1:0)-(y.y==='—'?1:0)||parseInt(y.y||'0')-parseInt(x.y||'0'));total+=laws.length;const fid='f_'+a.id,op=OF===fid?' open':'';
html+='<div class="folder'+op+'" id="'+fid+'"><div class="folder-header" onclick="toggleF(\''+fid+'\')"><span class="arrow">▶</span><span class="ficon">'+a.icon+'</span><div class="meta"><div class="name">'+a.name+'</div><div class="desc">'+a.desc+'</div></div><span class="badge">'+laws.length+'</span></div><div class="folder-body"><div class="law-list">';
for(const l of laws){const bt=!SB&&l.b?l.b.map(b=>'<span class="biz-tag">'+BM[b].e+BM[b].n+'</span>').join(''):'';let lnk='';if(l.u1)lnk+='<a href="'+l.u1+'" target="_blank">📄 '+l.l1+'</a>';if(l.u2)lnk+='<a href="'+l.u2+'" target="_blank">📄 '+l.l2+'</a>';
html+='<div class="law-row"><div class="year">'+(l.y==='—'?'':l.y)+'</div><div class="info"><div class="title">'+l.t+'</div><div class="src"><span>'+l.s+'</span></div>'+(bt?'<div class="biz-tags">'+bt+'</div>':'')+'</div><div class="links">'+lnk+'</div></div>'}
html+='</div></div></div>'}
mc.innerHTML=html||'<div class="empty">没有匹配的法规</div>';document.getElementById('statsBar').innerHTML='<span class="stat-pill">📂 显示 <strong>'+total+'</strong> 项法规</span>';}

function renderBiz(mc,s){let html='';
for(const bk of AB){let lws=[];for(const a of DATA.AREAS)for(const l of a.laws)if(l.b&&l.b.includes(bk))lws.push({...l,rn:a.name,ri:a.icon});const sd=new Set();lws=lws.filter(l=>{if(sd.has(l.t))return false;sd.add(l.t);return true});if(s)lws=lws.filter(l=>l.t.toLowerCase().includes(s));if(CS!=='all')lws=lws.filter(l=>l.s.includes(CS));lws.sort((x,y)=>(x.y==='—'?1:0)-(y.y==='—'?1:0)||parseInt(y.y||'0')-parseInt(x.y||'0'));if(!lws.length)continue;const fid='bz_'+bk,op=OF===fid?' open':'';
html+='<div class="folder'+op+'" id="'+fid+'"><div class="folder-header" onclick="toggleF(\''+fid+'\')"><span class="arrow">▶</span><span class="ficon">'+BM[bk].e+'</span><div class="meta"><div class="name">'+BM[bk].n+'</div><div class="desc">相关法规</div></div><span class="badge">'+lws.length+'</span></div><div class="folder-body"><div class="law-list">';
for(const l of lws){let lnk='';if(l.u1)lnk+='<a href="'+l.u1+'" target="_blank">📄 '+l.l1+'</a>';if(l.u2)lnk+='<a href="'+l.u2+'" target="_blank">📄 '+l.l2+'</a>';
html+='<div class="law-row"><div class="year">'+(l.y==='—'?'':l.y)+'</div><div class="info"><div class="title">'+l.t+'</div><div class="src"><span>'+l.s+'</span><span style="background:#F0E8FF;color:#6A1B9A;margin-left:2px;">'+l.ri+' '+l.rn+'</span></div></div><div class="links">'+lnk+'</div></div>'}
html+='</div></div></div>';}
mc.innerHTML=html||'<div class="empty">没有匹配的法规</div>';document.getElementById('statsBar').innerHTML='<span class="stat-pill">🏢 '+mc.querySelectorAll('.folder').length+' 个业务领域</span>';}

function renderEvents(mc,s){let events=[...DATA.EVENTS];
if(CS!=='all')events=events.filter(e=>e.s&&e.s.includes(CS));
if(SB)events=events.filter(e=>e.b.split(',').includes(SB));
if(s)events=events.filter(e=>e.t.toLowerCase().includes(s)||e.d.toLowerCase().includes(s));
events.sort((x,y)=>y.y.localeCompare(x.y));
if(!events.length){mc.innerHTML='<div class="empty">没有匹配的执法事件</div>';document.getElementById('statsBar').innerHTML='<span class="stat-pill">无结果</span>';return}
let html='<div class="folder-list">';
let c=0;const seen=new Set();
for(const e of events){const key=e.t+e.y;if(seen.has(key))continue;seen.add(key);c++;
const bizs=e.b.split(',').map(b=>BM[b]?BM[b].e+BM[b].n:'').filter(Boolean).join(' ');
const ri=RD[e.r];const rtag=ri?ri.ic+' '+ri.nm:'';
const tpcl=TPCL[e.tp]||'tp-info';
let lnk='';if(e.u1)lnk+='<a href="'+e.u1+'" target="_blank">📄 '+e.l1+'</a>';
html+='<div class="event-row law-row"><div class="year" style="width:48px">'+e.y+'</div><div class="info"><div class="title"><span class="tp '+tpcl+'">'+(TP[e.tp]||e.tp)+'</span>'+e.t+'</div><div class="src"><span class="risk-tag">'+rtag+'</span><span>'+bizs+'</span></div><div class="desc">'+e.d+'</div></div><div class="links">'+lnk+'</div></div>'}
html+='</div>';
mc.innerHTML=html;
document.getElementById('statsBar').innerHTML='<span class="stat-pill">🚨 近两年执法事件 <strong>'+c+'</strong> 件</span><span class="stat-pill">⚖️ 行政处罚 '+events.filter(e=>e.tp==='pun').length+'</span><span class="stat-pill">⚠️ 监管通报 '+events.filter(e=>e.tp==='warn').length+'</span><span class="stat-pill">🆕 新规 '+events.filter(e=>e.tp==='new').length+'</span>';}

function toggleF(id){OF=OF===id?null:id;render()}
function setSrc(s){CS=s;document.querySelectorAll('.filter-tab').forEach(t=>t.classList.toggle('active',t.dataset.src===s));render()}
function toggleBiz(b){SB=SB===b?null:b;render()}
function clearBizFilter(){SB=null;render()}
function switchView(v){CV=v;document.querySelectorAll('.view-btn').forEach((b,i)=>b.classList.toggle('active',i===(v==='risk'?0:v==='biz'?1:2)));OF=null;render()}
function updateBC(){for(const bk of AB){let c=0;for(const a of DATA.AREAS)for(const l of a.laws)if(l.b&&l.b.includes(bk))c++;const el=document.getElementById('cnt_'+bk);if(el)el.textContent=c+' 项'}}
(function ib(){const bb=document.getElementById('bizBar');bb.innerHTML='';for(const b of DATA.BIZ)bb.innerHTML+='<div class="biz-chip" data-biz="'+b.k+'" onclick="toggleBiz(\''+b.k+'\')"><div class="emoji">'+b.e+'</div><div class="info"><div class="name">'+b.n+'</div><div class="cnt" id="cnt_'+b.k+'"></div></div><div class="check">✓</div></div>';render()})();
</script>
