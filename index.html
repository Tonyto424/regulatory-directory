function renderHome(){
  document.getElementById("domainGrid").innerHTML=DOMAINS.map(d=>`<div class="domain-card" onclick="showDetail('${d.id}')"><div class="color-bar" style="background:${d.color}"></div><div class="icon">${d.icon}</div><div class="name">${d.name}</div><div class="count">${d.laws.length} 部</div></div>`).join("");
}
function showDetail(id){
  const d=DOMAINS.find(x=>x.id===id);if(!d)return;
  document.getElementById("searchInput").value="";
  document.getElementById("detailTitle").innerHTML=`${d.icon} ${d.name} <span class="tag-count">${d.laws.length} 部</span>`;
  const sm={effective:"st-e",progress:"st-p",draft:"st-d"},sl={effective:"已生效",progress:"立法中",draft:"草案"};
  document.getElementById("detailList").innerHTML=d.laws.map(l=>`<div class="law-item" style="--lc:${d.color}"><div class="top"><a class="name" href="${l.links[0].u}" target="_blank" rel="noopener">${l.name}</a><span class="st ${sm[l.st]||'st-e'}">${sl[l.st]||l.st}</span></div>${l.desc?`<div class="desc">${l.desc}</div>`:''}<div class="meta">${l.date?`<span>📅 ${l.date}</span>`:''}${l.penalty?`<span>⚡ ${l.penalty}</span>`:''}</div><div class="links">${l.links.map(lk=>`<a href="${lk.u}" target="_blank" rel="noopener">🔗 ${lk.t}</a>`).join('')}</div></div>`).join("");
  document.getElementById("homeView").style.display="none";document.getElementById("detailView").style.display="block";document.getElementById("sourcesView").style.display="none";document.getElementById("noResult").style.display="none";
  document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));document.getElementById("navHome").classList.add("active");
}
function renderSources(){
  document.getElementById("sourcesContent").innerHTML=`<div class="source-group"><h3>🏛️ 政府监管部门网站（${SOURCES_GOV.length} 个）</h3><div class="source-grid">${SOURCES_GOV.map(s=>`<div class="source-item"><span class="sn">${s.n}</span><a href="${s.u}" target="_blank" rel="noopener">访问 ↗</a></div>`).join('')}</div></div><div class="source-group"><h3>📐 行业协会与标准组织（${SOURCES_STD.length} 个）</h3><div class="source-grid">${SOURCES_STD.map(s=>`<div class="source-item"><span class="sn">${s.n}</span><a href="${s.u}" target="_blank" rel="noopener">访问 ↗</a></div>`).join('')}</div></div>`;
}
function showHome(){
  document.getElementById("homeView").style.display="block";document.getElementById("detailView").style.display="none";document.getElementById("sourcesView").style.display="none";document.getElementById("noResult").style.display="none";
  document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));document.getElementById("navHome").classList.add("active");
}
function switchView(v){
  document.getElementById("searchInput").value="";document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));document.getElementById("nav"+v[0].toUpperCase()+v.slice(1)).classList.add("active");document.getElementById("noResult").style.display="none";
  if(v==="home")showHome();else{document.getElementById("homeView").style.display="none";document.getElementById("detailView").style.display="none";document.getElementById("sourcesView").style.display="block";}
}
function doSearch(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase(),nr=document.getElementById("noResult");
  if(!q){showHome();return}
  document.getElementById("homeView").style.display="block";document.getElementById("detailView").style.display="none";document.getElementById("sourcesView").style.display="none";
  document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));document.getElementById("navHome").classList.add("active");
  let found=false;
  document.querySelectorAll(".domain-card").forEach((c,i)=>{const d=DOMAINS[i];if(!d)return;const m=d.name.toLowerCase().includes(q)||d.laws.some(l=>l.name.toLowerCase().includes(q)||(l.desc||'').toLowerCase().includes(q));c.style.display=m?"":"none";if(m)found=true;});
  nr.style.display=found?"none":"block";
}
renderHome();renderSources();
