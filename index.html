function render(){
  var html='',d,l,i,j;
  for(i=0;i<DOMAINS.length;i++){
    d=DOMAINS[i];
    html+='<div class="domain-card" onclick="showDetail('+"'"+d.id+"'"+')"><div class="color-bar" style="background:'+d.color+'"></div><div class="icon">'+d.icon+'</div><div class="name">'+d.name+'</div><div class="count">'+d.laws.length+' 部</div></div>';
  }
  document.getElementById("domainGrid").innerHTML=html;
}
function showDetail(id){
  var d,i,j,l,html='';
  for(i=0;i<DOMAINS.length;i++)if(DOMAINS[i].id==id){d=DOMAINS[i];break;}
  if(!d)return;
  document.getElementById("searchInput").value='';
  document.getElementById("detailTitle").innerHTML=d.icon+' '+d.name+' <span class="tag-count">'+d.laws.length+' 部</span>';
  for(i=0;i<d.laws.length;i++){
    l=d.laws[i];
    html+='<div class="law-item" style="border-left-color:'+d.color+'">';
    html+='<div class="top"><a class="name" href="'+getSrc(l.name)+'" target="_blank" rel="noopener">'+l.name+'</a>';
    html+='<span class="st '+(l.st=='e'?'st-e':l.st=='p'?'st-p':'st-d')+'">'+(l.st=='e'?'已生效':l.st=='p'?'立法中':'草案')+'</span></div>';
    if(l.desc)html+='<div class="desc">'+l.desc+'</div>';
    html+='<div class="meta">';
    if(l.date)html+='<span>📅 '+l.date+'</span>';
    if(l.penalty)html+='<span>⚡ '+l.penalty+'</span>';
    html+='</div>';
    html+='<div class="links"><a href="'+getSrc(l.name)+'" target="_blank" rel="noopener">🔗 查看原文</a></div></div>';
  }
  document.getElementById("detailList").innerHTML=html;
  document.getElementById("homeView").style.display='none';
  document.getElementById("detailView").style.display='block';
  document.getElementById("sourcesView").style.display='none';
  document.getElementById("noResult").style.display='none';
  document.getElementById("navHome").classList.add('active');
  document.getElementById("navSources").classList.remove('active');
}
function renderSources(){
  var html='<div class="source-group"><h3>🏛️ 政府监管部门网站（'+SOURCES_GOV.length+' 个）</h3><div class="source-grid">';
  for(var i=0;i<SOURCES_GOV.length;i++)html+='<div class="source-item"><span class="sn">'+SOURCES_GOV[i].n+'</span><a href="'+SOURCES_GOV[i].u+'" target="_blank" rel="noopener">访问 ↗</a></div>';
  html+='</div></div>';
  html+='<div class="source-group"><h3>📐 行业协会与标准组织（'+SOURCES_STD.length+' 个）</h3><div class="source-grid">';
  for(i=0;i<SOURCES_STD.length;i++)html+='<div class="source-item"><span class="sn">'+SOURCES_STD[i].n+'</span><a href="'+SOURCES_STD[i].u+'" target="_blank" rel="noopener">访问 ↗</a></div>';
  html+='</div></div>';
  document.getElementById("sourcesContent").innerHTML=html;
}
function showHome(){
  document.getElementById("homeView").style.display='block';
  document.getElementById("detailView").style.display='none';
  document.getElementById("sourcesView").style.display='none';
  document.getElementById("noResult").style.display='none';
  document.getElementById("navHome").classList.add('active');
  document.getElementById("navSources").classList.remove('active');
}
function switchView(v){
  document.getElementById("searchInput").value='';
  document.getElementById("noResult").style.display='none';
  document.getElementById("navHome").classList.remove('active');
  document.getElementById("navSources").classList.remove('active');
  if(v=='home'){
    showHome();
    document.getElementById("navHome").classList.add('active');
  }else{
    document.getElementById("homeView").style.display='none';
    document.getElementById("detailView").style.display='none';
    document.getElementById("sourcesView").style.display='block';
    document.getElementById("navSources").classList.add('active');
  }
}
function doSearch(){
  var q=document.getElementById("searchInput").value.trim().toLowerCase();
  var nr=document.getElementById("noResult");
  if(!q){showHome();return;}
  document.getElementById("homeView").style.display='block';
  document.getElementById("detailView").style.display='none';
  document.getElementById("sourcesView").style.display='none';
  document.getElementById("navHome").classList.add('active');
  document.getElementById("navSources").classList.remove('active');
  var cards=document.querySelectorAll(".domain-card"),found=false;
  for(var i=0;i<cards.length;i++){
    var d=DOMAINS[i];if(!d)continue;
    var match=d.name.toLowerCase().indexOf(q)!==-1;
    if(!match)for(var j=0;j<d.laws.length;j++){if(d.laws[j].name.toLowerCase().indexOf(q)!==-1||(d.laws[j].desc&&d.laws[j].desc.toLowerCase().indexOf(q)!==-1)){match=true;break;}}
    cards[i].style.display=match?'':'none';
    if(match)found=true;
  }
  nr.style.display=found?'none':'block';
}
render();
renderSources();
