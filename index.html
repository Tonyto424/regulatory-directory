<title>互联网合规法规导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a1a;line-height:1.6}
.header{background:linear-gradient(135deg,#0d47a1,#1a73e8);color:#fff;padding:40px 24px 32px;text-align:center}

.search-bar input{width:100%;padding:14px 16px 14px 44px;border:none;border-radius:12px;font-size:15px;outline:none;box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff}
.search-bar .icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);font-size:18px;color:#999}
.container{max-width:960px;margin:0 auto;padding:28px 16px 80px}
#homeView .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.domain-card{background:#fff;border-radius:14px;padding:20px 14px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .2s;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.domain-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)}
.domain-card .icon{font-size:32px;margin-bottom:8px}
.domain-card .name{font-size:14px;font-weight:600;color:#1a1a1a;margin-top:5px}
.domain-card .count{font-size:11px;color:#888;margin-top:3px}
.domain-card .color-bar{position:absolute;top:0;left:0;right:0;height:3px;transition:height .2s}
.domain-card:hover .color-bar{height:4px}
#detailView{display:none}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.back-btn{padding:8px 16px;border:none;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);color:#555;display:inline-flex;align-items:center;gap:4px;transition:all .2s}
.back-btn:hover{background:#f5f5f5;color:#1a73e8}
.detail-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.detail-title .tag-count{font-size:13px;font-weight:400;color:#888;background:#f0f0f0;padding:2px 10px;border-radius:10px}
.cat-group{margin-bottom:18px}
.cat-header{font-size:15px;font-weight:600;padding:6px 0 8px;border-bottom:2px solid #e0e0e0;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cat-header .cat-count{font-size:12px;font-weight:400;color:#888;background:#f0f0f0;padding:1px 8px;border-radius:8px}
.law-item{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid #1a73e8;transition:box-shadow .2s}
.law-item:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.law-item .top{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.law-item .name{font-size:14px;font-weight:600;color:#1a73e8;text-decoration:none}
.law-item .name:hover{text-decoration:underline}
.law-item .st{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}
.st-e{background:#e8f5e9;color:#2e7d32}.st-p{background:#fff3e0;color:#e65100}.st-d{background:#fce4ec;color:#c62828}
.law-item .desc{font-size:12.5px;color:#666;margin-top:4px}
.law-item .meta{font-size:11.5px;color:#999;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
.law-item .links{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.law-item .links a{display:inline-flex;align-items:center;gap:2px;padding:3px 9px;border-radius:6px;font-size:12px;text-decoration:none;background:#e8f0fe;color:#1a73e8;transition:background .2s}
.law-item .links a:hover{background:#d2e3fc}
#sourcesView{display:none}
.source-group{margin-bottom:24px}.source-group h3{font-size:16px;font-weight:600;margin-bottom:12px;padding:0 4px}
.source-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.source-item{background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:8px}
.source-item .sn{font-size:13px;color:#333;flex:1}
.source-item a{padding:4px 10px;border-radius:6px;font-size:12px;text-decoration:none;background:#e8f0fe;color:#1a73e8;white-space:nowrap}
.source-item a:hover{background:#d2e3fc}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:100}
.bottom-nav .btn{flex:1;text-align:center;padding:10px 0;cursor:pointer;font-size:13px;color:#888;border:none;background:transparent}
.bottom-nav .btn.active{color:#1a73e8;font-weight:600}
.bottom-nav .btn .bi{font-size:18px;display:block;margin-bottom:2px}
.bottom-nav .btn:hover{color:#1a73e8}
#noResult{text-align:center;padding:60px 20px;color:#999;display:none}
#casesView{display:none}
.case-item{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid #1a73e8;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.case-item .case-title{font-size:15px;font-weight:600;margin-bottom:6px;color:#1a1a1a}
.case-item .case-title a{color:#1a1a1a;text-decoration:none}
.case-item .case-title a:hover{color:#1a73e8;text-decoration:underline}
.case-item .case-meta{font-size:12px;color:#888;margin-bottom:6px}
.case-item .case-meta .tag{display:inline-block;padding:1px 8px;border-radius:8px;background:#e3f2fd;color:#1565c0;font-size:11px;margin-right:4px}
.case-item .case-summary{font-size:13px;color:#555;line-height:1.5}
.case-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.case-filter .btn{font-size:12px;padding:5px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;color:#555;cursor:pointer;transition:all .15s}
.case-filter .btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.case-filter .btn:hover{border-color:#1a73e8}
.case-count{font-size:13px;color:#888;margin-bottom:10px}

<div class="header">

<div class="container" id="app">
  <div id="homeView"><div class="grid" id="domainGrid"></div></div>

  <div id="sourcesView"><h2 style="margin-bottom:16px;font-size:18px">📎 参考源</h2><div id="sourcesContent"></div></div>

</div>
<div class="bottom-nav">
  <button class="btn active" id="navHome" onclick="switchView('home')"><span class="bi">🏠</span>合规领域</button>
  <button class="btn" id="navSources" onclick="switchView('sources')"><span class="bi">📎</span>参考源</button>
  <button class="btn" id="navCases" onclick="switchView('cases')"><span class="bi">⚖️</span>案例</button>
</div>

function renderCases(filter){
  if(!filter){filter=curCaseFilter;}else{curCaseFilter=filter;}
  var i,c,clist=[];
  for(i=0;i<CASES.length;i++){
    c=CASES[i];
    if(filter=="all"||c.domain==filter){clist.push(clist.length);}
  }
  clist.sort(function(a,b){return CASES[b].date.localeCompare(CASES[a].date);});
  var fhtml='<button class="btn'+(filter=="all"?" active":"")+'" onclick="renderCases(\'all\')">全部('+CASES.length+")</button>";
  var domains=["content","privacy","fraud","payment","bribery","antitrust","ad","secret","consumer","finance","license","marketing","trade"];
  for(i=0;i<domains.length;i++){
    var d=domains[i],cnt=0;
    for(var j=0;j<CASES.length;j++){if(CASES[j].domain==d){cnt++;}}
    if(cnt>0){
      fhtml+='<button class="btn'+(filter==d?" active":"")+'" onclick="renderCases(\''+d+'\')">'+DOMAIN_IDS[d]+"("+cnt+")</button>";
    }
  }
  document.getElementById("caseFilter").innerHTML=fhtml;
  document.getElementById("caseCount").innerHTML="共 "+clist.length+" 个案例";
  var html2="";
  for(i=0;i<clist.length;i++){
    c=CASES[clist[i]];
    var dc="#1a73e8";
    for(var jj=0;jj<DOMAINS.length;jj++){if(DOMAINS[jj].id==c.domain){dc=DOMAINS[jj].color;break;}}
    html2+='<div class="case-item" style="border-left-color:'+dc+'">';
    html2+='<div class="case-title"><a href="'+c.url+'" target="_blank" rel="noopener">'+c.title+"</a></div>";

    html2+='<div class="case-summary">'+c.summary+"</div></div>";
  }
  if(!html2){html2='<div style="text-align:center;padding:60px 20px;color:#999">暂无案例</div>';}
  document.getElementById("casesContent").innerHTML=html2;
}

function showDetail(id){
  var d,i,j,l,html="",cat,catHtml,catCount,grouped,sortedLaws,ci,key;
  for(i=0;i<DOMAINS.length;i++){if(DOMAINS[i].id==id){d=DOMAINS[i];break;}}
  if(!d)return;
  document.getElementById("searchInput").value="";
  document.getElementById("detailTitle").innerHTML=d.icon+" "+d.name+' <span class="tag-count">'+d.laws.length+" 部</span>";
  grouped={};
  for(i=0;i<CAT_ORDER.length;i++){grouped[CAT_ORDER[i]]=[];}
  for(i=0;i<d.laws.length;i++){
    l=d.laws[i];
    cat=l.cat||"rule";
    if(!grouped[cat])grouped[cat]=[];
    grouped[cat].push(l);
  }
  // Sort each group by effective date (newest first), no date last
  for(key in grouped){
    grouped[key].sort(function(a,b){
      var da=a.effective||"",db=b.effective||"";
      if(!da&&!db)return 0;
      if(!da)return 1;
      if(!db)return -1;
      return db.localeCompare(da);
    });
  }
  html="";
  for(ci=0;ci<CAT_ORDER.length;ci++){
    key=CAT_ORDER[ci];
    sortedLaws=grouped[key];
    if(!sortedLaws||sortedLaws.length===0)continue;
    catHtml="";
    for(i=0;i<sortedLaws.length;i++){
      l=sortedLaws[i];
      catHtml+='<div class="law-item" style="border-left-color:'+d.color+'">';
      catHtml+='<div class="top"><a class="name" href="'+getSrc(l.name)+'" target="_blank" rel="noopener">'+l.name+"</a>";
      catHtml+='<span class="st '+(l.st=="e"?"st-e":l.st=="p"?"st-p":"st-d")+'">'+(l.st=="e"?"已生效":l.st=="p"?"立法中":"草案")+"</span></div>";
      if(l.desc)catHtml+='<div class="desc">'+l.desc+"</div>";
      catHtml+='<div class="meta">';
      if(l.release)catHtml+="<span>📋 "+l.release+"</span>";
      if(l.effective)catHtml+="<span>✅ "+l.effective+"</span>";
      if(l.penalty)catHtml+="<span>⚡ "+l.penalty+"</span>";
      catHtml+="</div>";
      catHtml+='<div class="links"><a href="'+getSrc(l.name)+'" target="_blank" rel="noopener">🔗 查看原文</a></div></div>';
    }
    html+='<div class="cat-group"><div class="cat-header">'+CAT_LABELS[key]+' <span class="cat-count">'+sortedLaws.length+"</span></div>"+catHtml+"</div>";
  }
  document.getElementById("detailList").innerHTML=html;
  document.getElementById("homeView").style.display="none";
  document.getElementById("detailView").style.display="block";
  document.getElementById("sourcesView").style.display="none";
  document.getElementById("noResult").style.display="none";
  document.getElementById("navHome").classList.add("active");
  document.getElementById("navSources").classList.remove("active");
  document.getElementById("navCases").classList.remove("active");
}

function switchView(v){
  document.getElementById("searchInput").value="";
  document.getElementById("noResult").style.display="none";
  document.getElementById("detailView").style.display="none";
  document.getElementById("navHome").classList.remove("active");
  document.getElementById("navSources").classList.remove("active");
  document.getElementById("navCases").classList.remove("active");
  document.getElementById("navCases").classList.remove("active");
  document.getElementById("homeView").style.display=v=="home"?"block":"none";
  document.getElementById("sourcesView").style.display=v=="sources"?"block":"none";
  document.getElementById("casesView").style.display=v=="cases"?"block":"none";
  if(v=="home"){document.getElementById("navHome").classList.add("active");}
  else if(v=="cases"){document.getElementById("navCases").classList.add("active");renderCases();}
  else if(v=="sources"){document.getElementById("navSources").classList.add("active");}
}
function doSearch(){
  var q=document.getElementById("searchInput").value.trim().toLowerCase();
  var nr=document.getElementById("noResult");
  if(!q){showHome();return;}
  document.getElementById("homeView").style.display="block";
  document.getElementById("detailView").style.display="none";
  document.getElementById("sourcesView").style.display="none";
  document.getElementById("casesView").style.display="none";
  document.getElementById("navHome").classList.add("active");
  document.getElementById("navSources").classList.remove("active");
  document.getElementById("navCases").classList.remove("active");
  var cards=document.querySelectorAll(".domain-card"),found=false,i,j,d,match;
  for(i=0;i<cards.length;i++){
    d=DOMAINS[i];if(!d)continue;
    match=d.name.toLowerCase().indexOf(q)!==-1;
    if(!match)for(j=0;j<d.laws.length;j++){if(d.laws[j].name.toLowerCase().indexOf(q)!==-1||(d.laws[j].desc&&d.laws[j].desc.toLowerCase().indexOf(q)!==-1)){match=true;break;}}
    cards[i].style.display=match?"":"none";
    if(match)found=true;
  }
  nr.style.display=found?"none":"block";
}
