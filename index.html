<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互联网合规法规导航</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:#f0f2f5;color:#1a1a1a;line-height:1.6
  }
  .header{
    background:linear-gradient(135deg,#0d47a1,#1a73e8);
    color:#fff;padding:40px 24px 32px;text-align:center
  }
  .header h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:1px}
  .header p{font-size:14px;opacity:.82;max-width:600px;margin:0 auto}
  .header .badge{margin-top:10px;display:inline-flex;gap:8px;font-size:12px;opacity:.7}
  .search-bar{
    max-width:600px;margin:-20px auto 0;position:relative;z-index:2;padding:0 16px
  }
  .search-bar input{
    width:100%;padding:14px 16px 14px 44px;border:none;border-radius:12px;
    font-size:15px;outline:none;box-shadow:0 2px 12px rgba(0,0,0,.12);
    background:#fff
  }
  .search-bar .icon{position:absolute;left:30px;top:50%;transform:translateY(-50%);font-size:18px;color:#999}
  .container{max-width:960px;margin:0 auto;padding:28px 16px 80px}

  /* 首页卡片 */
  #homeView .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px
  }
  .domain-card{
    background:#fff;border-radius:14px;padding:20px 14px;cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .2s;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    position:relative;overflow:hidden;border:1px solid transparent
  }
  .domain-card:hover{
    box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)
  }
  .domain-card .icon{font-size:32px;margin-bottom:8px}
  .domain-card .name{font-size:14px;font-weight:600;color:#1a1a1a}
  .domain-card .count{font-size:11px;color:#888;margin-top:4px}
  .domain-card .color-bar{
    position:absolute;top:0;left:0;right:0;height:3px;
    transition:height .2s
  }
  .domain-card:hover .color-bar{height:4px}

  /* 详情视图 */
  #detailView{display:none}
  .detail-header{
    display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap
  }
  .back-btn{
    padding:8px 16px;border:none;border-radius:8px;background:#fff;cursor:pointer;
    font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);color:#555;
    display:inline-flex;align-items:center;gap:4px;transition:all .2s
  }
  .back-btn:hover{background:#f5f5f5;color:#1a73e8}
  .detail-title{
    font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px
  }
  .detail-title .tag-count{
    font-size:13px;font-weight:400;color:#888;background:#f0f0f0;
    padding:2px 10px;border-radius:10px
  }
  .law-item{
    background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    border-left:4px solid var(--lc,#1a73e8);
    transition:box-shadow .2s
  }
  .law-item:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
  .law-item .top{
    display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap
  }
  .law-item .name{font-size:15px;font-weight:600;color:#1a73e8;text-decoration:none}
  .law-item .name:hover{text-decoration:underline}
  .law-item .st{
    display:inline-block;padding:2px 8px;border-radius:4px;
    font-size:11px;font-weight:500;white-space:nowrap
  }
  .st-e{background:#e8f5e9;color:#2e7d32}
  .st-p{background:#fff3e0;color:#e65100}
  .st-d{background:#fce4ec;color:#c62828}
  .law-item .desc{font-size:13px;color:#666;margin-top:6px}
  .law-item .meta{
    font-size:12px;color:#999;margin-top:4px;display:flex;flex-wrap:wrap;gap:8px
  }
  .law-item .links{
    margin-top:8px;display:flex;flex-wrap:wrap;gap:6px
  }
  .law-item .links a{
    display:inline-flex;align-items:center;gap:3px;
    padding:4px 10px;border-radius:6px;font-size:12px;
    text-decoration:none;background:#e8f0fe;color:#1a73e8;
    transition:background .2s
  }
  .law-item .links a:hover{background:#d2e3fc}

  /* 参考源视图 */
  #sourcesView{display:none}
  .source-group{margin-bottom:24px}
  .source-group h3{font-size:16px;font-weight:600;margin-bottom:12px;padding:0 4px}
  .source-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px
  }
  .source-item{
    background:#fff;border-radius:10px;padding:12px 16px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    display:flex;align-items:center;justify-content:space-between;gap:8px
  }
  .source-item .sn{font-size:13px;color:#333;flex:1}
  .source-item a{
    padding:4px 10px;border-radius:6px;font-size:12px;
    text-decoration:none;background:#e8f0fe;color:#1a73e8;white-space:nowrap;
    transition:background .2s
  }
  .source-item a:hover{background:#d2e3fc}

  /* 底部导航 */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;background:#fff;border-top:1px solid #eee;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:100
  }
  .bottom-nav .btn{
    flex:1;text-align:center;padding:10px 0;cursor:pointer;
    font-size:13px;color:#888;transition:all .2s;border:none;background:transparent
  }
  .bottom-nav .btn.active{color:#1a73e8;font-weight:600}
  .bottom-nav .btn .bi{font-size:18px;display:block;margin-bottom:2px}
  .bottom-nav .btn:hover{color:#1a73e8}
  #noResult{text-align:center;padding:60px 20px;color:#999;display:none}

  @media(max-width:640px){
    .header{padding:32px 16px 24px}
    .header h1{font-size:22px}
    .container{padding:20px 12px 80px}
    #homeView .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .domain-card{padding:16px 10px}
    .domain-card .icon{font-size:26px}
    .source-grid{grid-template-columns:1fr}
    .law-item{padding:12px 14px}
  }
</style>
</head>
<body>

<div class="header">
  <h1>📋 互联网合规法规导航</h1>
  <p>按合规领域分类呈现法律法规原文链接，点击卡片进入法规清单</p>
  <div class="badge">13 个合规领域 · 50+ 部核心法规 · 40+ 监管及标准网站</div>
</div>

<div class="search-bar">
  <span class="icon">🔍</span>
  <input type="text" id="searchInput" placeholder="搜索法规名称或关键词..." oninput="doSearch()">
</div>

<div class="container" id="app">
  <div id="homeView">
    <div class="grid" id="domainGrid"></div>
  </div>

  <div id="detailView">
    <div class="detail-header">
      <button class="back-btn" onclick="showHome()">← 返回</button>
      <span class="detail-title" id="detailTitle"></span>
    </div>
    <div id="detailList"></div>
  </div>

  <div id="sourcesView">
    <h2 style="margin-bottom:16px;font-size:18px">📎 参考源</h2>
    <div id="sourcesContent"></div>
  </div>

  <div id="noResult">🔍 未找到相关法规</div>
</div>

<div class="bottom-nav">
  <button class="btn active" id="navHome" onclick="switchView('home')">
    <span class="bi">🏠</span>合规领域
  </button>
  <button class="btn" id="navSources" onclick="switchView('sources')">
    <span class="bi">📎</span>参考源
  </button>
</div>

// ==================== 渲染 ====================
function renderHome() {
  const grid = document.getElementById("domainGrid");
  grid.innerHTML = DOMAINS.map(d =>
    `<div class="domain-card" onclick="showDetail('${d.id}')">
      <div class="color-bar" style="background:${d.color}"></div>
      <div class="icon">${d.icon}</div>
      <div class="name">${d.name}</div>
      <div class="count">${d.laws.length} 部法规</div>
    </div>`
  ).join("");
}

function showDetail(domainId) {
  const d = DOMAINS.find(x => x.id === domainId);
  if (!d) return;
  document.getElementById("searchInput").value = "";
  document.getElementById("detailTitle").innerHTML =
    `${d.icon} ${d.name} <span class="tag-count">${d.laws.length} 部</span>`;
  const stMap = {effective:"st-e",progress:"st-p",draft:"st-d"};
  const stLabel = {effective:"已生效",progress:"立法中",draft:"草案"};
  document.getElementById("detailList").innerHTML = d.laws.map(l =>
    `<div class="law-item" style="--lc:${d.color}">
      <div class="top">
        <a class="name" href="${l.links[0].u}" target="_blank" rel="noopener">${l.name}</a>
        <span class="st ${stMap[l.st]||'st-e'}">${stLabel[l.st]||l.st}</span>
      </div>
      <div class="desc">${l.desc||''}</div>
      <div class="meta">
        ${l.date?`<span>📅 ${l.date}</span>`:''}${l.penalty?`<span>⚡ ${l.penalty}</span>`:''}
      </div>
      <div class="links">${l.links.map(lk=>`<a href="${lk.u}" target="_blank" rel="noopener">🔗 ${lk.t}</a>`).join('')}</div>
    </div>`
  ).join("");
  document.getElementById("homeView").style.display="none";
  document.getElementById("detailView").style.display="block";
  document.getElementById("sourcesView").style.display="none";
  document.getElementById("noResult").style.display="none";
  document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("navHome").classList.add("active");
}

function renderSources() {
  document.getElementById("sourcesContent").innerHTML =
    `<div class="source-group"><h3>🏛️ 政府监管部门网站（${SOURCES_GOV.length} 个）</h3>
      <div class="source-grid">${SOURCES_GOV.map(s=>`<div class="source-item"><span class="sn">${s.n}</span><a href="${s.u}" target="_blank" rel="noopener">访问 ↗</a></div>`).join('')}</div></div>
    <div class="source-group"><h3>📐 行业协会与标准组织（${SOURCES_STD.length} 个）</h3>
      <div class="source-grid">${SOURCES_STD.map(s=>`<div class="source-item"><span class="sn">${s.n}</span><a href="${s.u}" target="_blank" rel="noopener">访问 ↗</a></div>`).join('')}</div></div>`;
}

function showHome() {
  document.getElementById("homeView").style.display="block";
  document.getElementById("detailView").style.display="none";
  document.getElementById("sourcesView").style.display="none";
  document.getElementById("noResult").style.display="none";
  document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("navHome").classList.add("active");
}

function switchView(v) {
  document.getElementById("searchInput").value="";
  document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(`nav${v[0].toUpperCase()+v.slice(1)}`).classList.add("active");
  document.getElementById("noResult").style.display="none";
  if(v==="home"){showHome()}
  else{
    document.getElementById("homeView").style.display="none";
    document.getElementById("detailView").style.display="none";
    document.getElementById("sourcesView").style.display="block";
  }
}

function doSearch() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const noResult=document.getElementById("noResult");
  if(!q){showHome();return}
  document.getElementById("homeView").style.display="block";
  document.getElementById("detailView").style.display="none";
  document.getElementById("sourcesView").style.display="none";
  document.querySelectorAll(".bottom-nav .btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("navHome").classList.add("active");
  let found=false;
  const cards=document.querySelectorAll(".domain-card");
  cards.forEach((c,i)=>{
    const d=DOMAINS[i];if(!d)return;
    const m=d.name.toLowerCase().includes(q)||d.laws.some(l=>l.name.toLowerCase().includes(q)||(l.desc||'').toLowerCase().includes(q));
    c.style.display=m?"":"none";
    if(m)found=true;
  });
  noResult.style.display=found?"none":"block";
}

// ==================== 初始化 ====================
renderHome();
renderSources();
